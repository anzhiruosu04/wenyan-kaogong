<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F3EF">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>错题本 · 文渊</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <header class="masthead">
    <h1><a href="index.html" class="back">←</a>错题本</h1>
    <div class="rule"></div>
    <p id="sub">只看答错的题；之后做对了会自动移出</p>
  </header>

  <div id="top"></div>
  <div id="list"><div class="loading">载 入 中</div></div>

  <footer class="foot"><div id="foot"></div></footer>
</div>

<script src="common.js"></script>
<script>
(async function () {
  let index;
  try {
    index = await loadJSON(DATA + "index.json");
  } catch (e) {
    $("#list").innerHTML = '<div class="loading">加载失败：' + esc(e.message) + '</div>';
    return;
  }

  const nameOf = {};
  index.modules.forEach((m) => m.cats.forEach((c) => { nameOf[c.id] = { name: c.name, mod: m.name }; }));

  const wrong = prog.wrong();

  if (!wrong.length) {
    $("#top").innerHTML = "";
    $("#list").innerHTML = '<div class="empty">错题本是空的。<br><span>去做几道，答错的会自动收进来。</span></div>' +
      '<div style="text-align:center;margin-top:22px"><a class="btn solid" href="index.html">回目录</a></div>';
    $("#foot").textContent = "记录保存在本机浏览器里，不会上传。";
    return;
  }

  /* 顶部操作 */
  $("#top").innerHTML =
    '<div class="overview">' +
      '<div class="ov-item"><b>' + wrong.length + '</b><span>道错题</span></div>' +
      '<button class="btn solid" id="redrill">开始重刷 →</button>' +
      '<button class="btn ghost" id="clear">清空记录</button>' +
    '</div>';

  /* 按分类分组 */
  const groups = {};
  wrong.forEach(function (w) {
    const cid = w.cid || "?";
    (groups[cid] = groups[cid] || []).push(w);
  });

  const order = [];
  index.modules.forEach((m) => m.cats.forEach((c) => { if (groups[c.id]) order.push(c.id); }));
  Object.keys(groups).forEach((k) => { if (order.indexOf(k) < 0) order.push(k); });

  $("#list").innerHTML = order.map(function (cid) {
    const info = nameOf[cid] || { name: "未分类", mod: "" };
    const rows = groups[cid].map(function (w) {
      const t = w.title || ("题目 " + w.qid);
      return '<a class="wq" href="practice.html?q=' + encodeURIComponent(w.qid) + '">' +
        '<span class="wt">' + esc(t) + '</span>' +
        (w.yr || w.rg ? '<span class="wm">' + esc([w.yr, w.rg].filter(Boolean).join(" ")) + "</span>" : "") +
        (w.wc > 1 ? '<span class="wc">错 ' + w.wc + ' 次</span>' : "") +
        "</a>";
    }).join("");
    return '<section class="module">' +
      '<div class="module-head"><h2>' + esc(info.name) + '</h2><span>' + groups[cid].length + ' 道</span></div>' +
      '<div class="wlist">' + rows + '</div></section>';
  }).join("");

  $("#redrill").onclick = function () {
    store.set("queue", shuffle(wrong.map((w) => w.qid)));
    location.href = "practice.html?mode=queue";
  };

  $("#clear").onclick = function () {
    if (!confirm("清空全部答题记录？错题本和进度都会归零，且无法恢复。")) return;
    prog.clear();
    store.set("last", null);
    location.reload();
  };

  $("#foot").textContent = "共 " + wrong.length + " 道 · 记录保存在本机浏览器里，不会上传。";
})();
</script>
</body>
</html>
