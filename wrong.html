<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F3EF">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>错题本 · 文渊</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <header class="masthead">
    <h1><a href="index.html" class="back">←</a>错题本</h1>
    <div class="rule"></div>
    <p id="sub">只看答错的题；之后做对了会自动移出</p>
  </header>

  <div id="bar"></div>
  <div id="list"><div class="loading">载 入 中</div></div>

  <footer class="foot"><div id="foot"></div></footer>
</div>

<div id="mask" class="mask"><div class="maskbox"><b id="mt">处理中</b><span id="ms"></span></div></div>

<script src="common.js"></script>
<script src="export.js"></script>
<script>
(async function () {
  let index;
  try { index = await loadJSON(DATA + "index.json"); }
  catch (e) { $("#list").innerHTML = '<div class="loading">加载失败：' + esc(e.message) + '</div>'; return; }

  const nameOf = {};
  index.modules.forEach((m) => m.cats.forEach((c) => { nameOf[c.id] = c.name; }));

  const wrong = prog.wrong();
  if (!wrong.length) {
    $("#list").innerHTML = '<div class="empty">错题本是空的。<br><span>去做几道，答错的会自动收进来。</span></div>' +
      '<div style="text-align:center;margin-top:22px"><a class="btn solid" href="index.html">回目录</a></div>';
    $("#foot").textContent = "记录保存在本机浏览器里，不会上传。";
    return;
  }

  let filter = "all";
  let catFilter = "";
  const sel = new Set();
  const cats = [];
  wrong.forEach((w) => { if (w.cid && cats.indexOf(w.cid) < 0) cats.push(w.cid); });

  function match(w) {
    if (catFilter && w.cid !== catFilter) return false;
    if (filter === "repeat") return (w.wc || 1) >= 2;
    if (filter === "recent") return Date.now() - (w.ts || 0) < 30 * 86400000;
    return true;
  }

  $("#bar").innerHTML =
    '<div class="exbar">' +
      '<div class="exrow">' +
        '<button class="chipbtn on" data-f="all">全部</button>' +
        '<button class="chipbtn" data-f="repeat">错≥2次</button>' +
        '<button class="chipbtn" data-f="recent">最近30天</button>' +
        '<select id="cf" class="catsel"><option value="">全部分类</option>' +
          cats.map((c) => '<option value="' + c + '">' + esc(nameOf[c] || c) + '</option>').join("") +
        '</select>' +
      '</div>' +
      '<div class="exrow exfoot">' +
        '<span class="selinfo">已选 <b id="seln">0</b> / <i id="alln">' + wrong.length + '</i></span>' +
        '<button class="btn" id="selall">全选</button>' +
        '<button class="btn" id="selnone">清空</button>' +
        '<button class="btn solid" id="exp" disabled>导出 Word</button>' +
      '</div>' +
    '</div>';

  function draw() {
    const groups = {};
    wrong.filter(match).forEach((w) => { (groups[w.cid] = groups[w.cid] || []).push(w); });
    const order = cats.filter((c) => groups[c]);

    $("#list").innerHTML = order.map(function (cid) {
      const rows = groups[cid].map(function (w) {
        return '<div class="wq">' +
          '<input type="checkbox" class="ck"' + (sel.has(w.qid) ? " checked" : "") + ' data-q="' + w.qid + '">' +
          '<a class="wt" href="practice.html?q=' + encodeURIComponent(w.qid) + '">' + esc(w.title || w.qid) + '</a>' +
          (w.yr || w.rg ? '<span class="wm">' + esc([w.yr, w.rg].filter(Boolean).join(" ")) + '</span>' : "") +
          (w.wc > 1 ? '<span class="wc">错 ' + w.wc + ' 次</span>' : "") +
        '</div>';
      }).join("");
      return '<section class="module">' +
        '<div class="module-head"><h2>' + esc(nameOf[cid] || "未分类") + '</h2><span>' + groups[cid].length + ' 道</span></div>' +
        '<div class="wlist">' + rows + '</div></section>';
    }).join("") || '<div class="empty">当前筛选下没有题</div>';

    $("#alln").textContent = wrong.filter(match).length;
    upd();
  }

  function upd() {
    $("#seln").textContent = sel.size;
    $("#exp").disabled = sel.size === 0;
  }

  document.addEventListener("change", function (e) {
    const ck = e.target.closest(".ck");
    if (!ck) return;
    if (ck.checked) sel.add(ck.dataset.q); else sel.delete(ck.dataset.q);
    upd();
  });

  $("#bar").addEventListener("click", function (e) {
    const f = e.target.closest("button[data-f]");
    if (f) {
      filter = f.dataset.f;
      document.querySelectorAll(".chipbtn").forEach((b) => b.classList.toggle("on", b === f));
      draw();
      return;
    }
    if (e.target.id === "selall") { wrong.filter(match).forEach((w) => sel.add(w.qid)); draw(); }
    else if (e.target.id === "selnone") { sel.clear(); draw(); }
    else if (e.target.id === "exp") runExport();
  });

  $("#bar").addEventListener("change", function (e) {
    if (e.target.id === "cf") { catFilter = e.target.value; draw(); }
  });

  async function runExport() {
    const qids = Array.from(sel);
    if (!qids.length) return;
    const mask = $("#mask");
    mask.classList.add("on");
    const say = (t, s) => { $("#mt").textContent = t; $("#ms").textContent = s; };
    try {
      say("正在收集题目", "0 / " + qids.length);
      const items = await WYExport.collect(qids, (i, n) => say("正在收集题目", i + " / " + n));
      const picked = new Map(wrong.map((w) => [w.qid, w.picked || ""]));
      items.forEach((q) => { q.picked = picked.get(q.qid) || ""; });

      say("正在生成 Word", items.length + " 道题");
      const blob = await WYExport.docx(items, {}, (i, n) => say("正在生成 Word", i + " / " + n));
      const d = new Date();
      const name = "错题本-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") +
        String(d.getDate()).padStart(2, "0") + "-" + items.length + "道.docx";
      WYExport.save(blob, name);
      $("#foot").textContent = "已导出 " + items.length + " 道错题。";
    } catch (e) {
      alert("导出失败：" + e.message);
    } finally {
      mask.classList.remove("on");
    }
  }

  draw();
  $("#foot").textContent = "共 " + wrong.length + " 道 · 勾选后导出，记录保存在本机浏览器里";
})();
</script>
</body>
</html>
